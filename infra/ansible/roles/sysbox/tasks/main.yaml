---
# ==============================================================================
# ROLE SYSBOX: TRIỂN KHAI ĐỘNG CƠ CONTAINER-IN-CONTAINER VÀ RUNTIMECLASS
# (Cài đặt vật lý qua file .deb thay vì DaemonSet để fix lỗi tương thích Kernel 6.8)
# ==============================================================================
- name: Tải file cài đặt Sysbox 0.7.1
  ansible.builtin.get_url:
    url: "https://downloads.nestybox.com/sysbox/releases/v0.7.1/sysbox-ce_0.7.1-0.linux_amd64.deb"
    dest: "/tmp/sysbox.deb"
    mode: "0644"

- name: Cài đặt Sysbox trực tiếp qua gói deb (Bypass lỗi Kernel 6.8+ U24.04)
  ansible.builtin.apt:
    deb: "/tmp/sysbox.deb"
    state: present

- name: Khởi động lại dịch vụ Sysbox để áp dụng cấu hình
  ansible.builtin.systemd:
    name: sysbox
    state: restarted
    enabled: true

- name: Đợi tất cả các node trong cụm K8s sẵn sàng (Chạy trên Master)
  ansible.builtin.command:
    cmd: "{{ sysbox_kubectl }} wait --for=condition=Ready node --all --timeout=300s"
  changed_when: false
  retries: 3
  delay: 10
  register: sysbox_wait_nodes
  until: sysbox_wait_nodes.rc == 0
  run_once: true
  delegate_to: "{{ groups['k8s_master'][0] | default(inventory_hostname) }}"

- name: Đánh nhãn (Label) cho tất cả các node (Chạy trên Master)
  ansible.builtin.command:
    cmd: "{{ sysbox_kubectl }} label nodes --all sysbox-install=yes --overwrite"
  changed_when: false
  run_once: true
  delegate_to: "{{ groups['k8s_master'][0] | default(inventory_hostname) }}"

- name: Đợi sysbox-runc xuất hiện trên hệ thống (Cục bộ)
  ansible.builtin.wait_for:
    path: /usr/bin/sysbox-runc
    state: present
    timeout: 120

- name: Khởi động lại Kubelet (nếu dùng Kubeadm) để nhận diện RuntimeClass mới
  ansible.builtin.systemd:
    name: kubelet
    state: restarted
  when: (kubernetes_distro | default('kubeadm')) == 'kubeadm'

- name: Khởi động lại K3s Server (trên Master) để nhận diện RuntimeClass mới
  ansible.builtin.systemd:
    name: k3s
    state: restarted
  when:
    - (kubernetes_distro | default('kubeadm')) == 'k3s'
    - inventory_hostname in groups['k8s_master'] | default([])

- name: Khởi động lại K3s Agent (trên Worker) để nhận diện RuntimeClass mới
  ansible.builtin.systemd:
    name: k3s-agent
    state: restarted
  when:
    - (kubernetes_distro | default('kubeadm')) == 'k3s'
    - inventory_hostname in groups['k8s_workers'] | default([])

- name: Tạo định nghĩa Sysbox RuntimeClass (Chạy trên Master)
  ansible.builtin.copy:
    dest: /tmp/sysbox-runtimeclass.yaml
    content: |
      apiVersion: node.k8s.io/v1
      kind: RuntimeClass
      metadata:
        name: sysbox-runc
      handler: sysbox-runc
    mode: "0644"
  run_once: true
  delegate_to: "{{ groups['k8s_master'][0] | default(inventory_hostname) }}"

- name: Apply Sysbox RuntimeClass vào cụm Kubernetes (Chạy trên Master)
  ansible.builtin.command:
    cmd: "{{ sysbox_kubectl }} apply -f /tmp/sysbox-runtimeclass.yaml"
  changed_when: true
  run_once: true
  delegate_to: "{{ groups['k8s_master'][0] | default(inventory_hostname) }}"

- name: In ra thông báo trạng thái cụm K8s (Chạy trên Master)
  ansible.builtin.shell:
    cmd: "{{ sysbox_kubectl }} get nodes -o wide && {{ sysbox_kubectl }} get runtimeclass"
    executable: /bin/bash
  register: sysbox_cluster_summary
  changed_when: false
  run_once: true
  delegate_to: "{{ groups['k8s_master'][0] | default(inventory_hostname) }}"

- name: Tổng hợp kết quả cài đặt Sysbox
  ansible.builtin.debug:
    var: sysbox_cluster_summary.stdout_lines
  run_once: true
