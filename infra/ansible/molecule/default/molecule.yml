---
# molecule/default/molecule.yml
driver:
  name: docker

platforms:
  - name: k8s-node-test
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    command: /lib/systemd/systemd
    privileged: true
    pre_build_image: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    tmpfs:
      - /run
      - /tmp

provisioner:
  name: ansible
  playbooks:
    converge: converge.yml
    verify: verify.yml
  # MOLECULE_SCENARIO_DIRECTORY được Molecule inject tự động, trỏ tới
  # infra/ansible/molecule/default/ → ../../roles = infra/ansible/roles/
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_SCENARIO_DIRECTORY}/../../roles"
  options:
    # Verbose để hiển thị lỗi syntax đầy đủ trong CI logs
    v: true
  inventory:
    group_vars:
      all:
        kubernetes_distro: "k3s"
        common_enable_shiftfs: false
        common_enable_lxcfs: false

# Bỏ qua dependency và cleanup vì không có requirements.yml hay cleanup.yml
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy

verifier:
  name: ansible
