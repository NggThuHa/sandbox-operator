# ==============================================================================
# DANH SÁCH MÁY CHỦ CỦA CỤM KUBERNETES LAB (KUBESPRAY STYLE INVENTORY)
# ==============================================================================
# Dùng chung cho mọi nhà phân phối: Kubeadm (Mặc định) hoặc K3s.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. NHÓM CONTROL PLANE (Kube-apiserver Master Node):
# ------------------------------------------------------------------------------
[k8s_master]
127.0.0.1 ansible_connection=local


# ------------------------------------------------------------------------------
# 2. NHÓM WORKER NODES (Nhà xưởng chạy máy ảo Lab cho sinh viên):
# ------------------------------------------------------------------------------
[k8s_workers]
# Liệt kê từng IP:
# 192.168.1.101
# 192.168.1.102
# 192.168.1.103

# Hoặc dùng cú pháp DẢI IP / TÊN MIỀN HÀNG LOẠT (Range syntax):
# node-worker-[01:05].lab.toiyeuptit.com
# 192.168.10.[50:60]

[k8s_workers:vars]
ansible_user=<USER>
# ansible_ssh_private_key_file=~/.ssh/id_rsa
# ansible_become_pass="your_sudo_password"


# ==============================================================================
# 3. NHÓM TỔNG HỢP TOÀN CỤM K8S CLUSTER:
# (Tương tự k8s_cluster:children trong Kubespray)
# ==============================================================================
[k8s_cluster:children]
k8s_master
k8s_workers
