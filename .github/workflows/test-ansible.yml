name: Ansible Tests

on:
  push:
    paths:
      - 'ansible/**'
      - '.github/workflows/test-ansible.yml'
  pull_request:
    paths:
      - 'ansible/**'
      - '.github/workflows/test-ansible.yml'

permissions: {}

jobs:
  ansible-test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible, ansible-lint and Molecule
        run: |
          pip install ansible ansible-lint molecule "molecule-plugins[docker]" docker

      - name: Syntax check all playbooks (Kubeadm default)
        working-directory: ansible
        run: |
          ansible-playbook cluster.yml \
            -i "localhost," \
            -e "ansible_connection=local" \
            --syntax-check

      - name: Syntax check all playbooks (K3s mode)
        working-directory: ansible
        run: |
          ansible-playbook cluster.yml \
            -i "localhost," \
            -e "ansible_connection=local" \
            -e "kubernetes_distro=k3s" \
            --syntax-check

      - name: Run ansible-lint
        working-directory: ansible
        run: ansible-lint cluster.yml

      - name: Run Molecule test (common role)
        working-directory: ansible
        env:
          # Cho phép Molecule dùng Docker daemon của runner
          DOCKER_HOST: unix:///var/run/docker.sock
        run: |
          molecule test -s default
