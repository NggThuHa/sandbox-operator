---
# ==============================================================================
# ROLE COMMON: HẠ TẦNG VÀ TIÊU CHUẨN HỆ ĐIỀU HÀNH CHUNG (K3S & KUBEADM)
# ==============================================================================
- name: Check supported OS family
  ansible.builtin.fail:
    msg: "This playbook currently supports Debian/Ubuntu-based systems only."
  when: ansible_os_family != "Debian"

- name: Check systemd service manager
  ansible.builtin.fail:
    msg: "This playbook requires systemd."
  when: ansible_service_mgr != "systemd"

# ------------------------------------------------------------------------------
# 1. KIỂM TRA VÀ TẮT SWAP (BẮT BUỘC CHO KUBEADM VÀ HIỆU GIỆN CHO K3S)
# ------------------------------------------------------------------------------
- name: Disable swap immediately (swapoff -a)
  ansible.builtin.command:
    cmd: swapoff -a
  when:
    - ansible_virtualization_type | default('') != "docker"
    - ansible_swaptotals_mb | default(0) > 0
  changed_when: false
  failed_when: false

- name: Disable swap permanently in /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\bswap\b.*)$'
    replace: '# \1'
  when: ansible_virtualization_type | default('') != "docker"
  failed_when: false

# ------------------------------------------------------------------------------
# 2. KIỂM TRA VÀ NÂNG CẤP KERNEL HWE (>= 5.7) CHO UBUNTU 20.04 (SECCOMP NOTIFY)
# ------------------------------------------------------------------------------
- name: Install HWE kernel on Ubuntu 20.04 to support Sysbox seccomp notify (>= 5.7)
  ansible.builtin.apt:
    name: linux-generic-hwe-20.04
    state: present
    update_cache: true
    install_recommends: true
  register: common_kernel_upgrade
  when:
    - ansible_distribution == "Ubuntu"
    - ansible_distribution_version == "20.04"
    - ansible_kernel is version('5.7', '<')
    - ansible_virtualization_type | default('') != "docker"

- name: Reboot server immediately after kernel upgrade # noqa: no-handler
  ansible.builtin.reboot:
    msg: "Rebooting to activate upgraded HWE kernel for Sysbox compatibility"
    reboot_timeout: 600
  when:
    - common_kernel_upgrade.changed | default(false)

# ------------------------------------------------------------------------------
# 3. KIỂM TRA VÀ BẢO TRỤ CGROUP V2 (HẠ TẦNG KÉP TỪ CGROUP V1 -> V2)
# ------------------------------------------------------------------------------
- name: Check current cgroup filesystem version
  ansible.builtin.command:
    cmd: stat -fc %T /sys/fs/cgroup
  register: common_cgroup_fs_check
  changed_when: false
  failed_when: false
  when: ansible_virtualization_type | default('') != "docker"

- name: Enforce cgroup v2 in GRUB configuration if currently on cgroup v1 (tmpfs)
  ansible.builtin.replace:
    path: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX=".*)"$'
    replace: '\1 systemd.unified_cgroup_hierarchy=1"'
  register: common_grub_cgroup_update
  when:
    - ansible_virtualization_type | default('') != "docker"
    - common_cgroup_fs_check.stdout is defined
    - common_cgroup_fs_check.stdout == "tmpfs"
  failed_when: false

- name: Fallback append cgroup v2 if GRUB_CMDLINE_LINUX is completely blank
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX=""$'
    line: 'GRUB_CMDLINE_LINUX="systemd.unified_cgroup_hierarchy=1"'
  register: common_grub_cgroup_append
  when:
    - ansible_virtualization_type | default('') != "docker"
    - common_cgroup_fs_check.stdout is defined
    - common_cgroup_fs_check.stdout == "tmpfs"
    - not (common_grub_cgroup_update.changed | default(false))
  failed_when: false

- name: Update GRUB bootloader configuration # noqa: no-handler
  ansible.builtin.command:
    cmd: update-grub
  changed_when: true
  when:
    - (common_grub_cgroup_update.changed | default(false)) or (common_grub_cgroup_append.changed | default(false))

- name: Reboot server to activate cgroup v2 hierarchy # noqa: no-handler
  ansible.builtin.reboot:
    msg: "Rebooting node to activate cgroup v2 hierarchy (cgroup2fs)"
    reboot_timeout: 600
  when:
    - (common_grub_cgroup_update.changed | default(false)) or (common_grub_cgroup_append.changed | default(false))

# ------------------------------------------------------------------------------
# 4. CÀI ĐẶT GÓI HỖ TRỢ NỀN TẢNG & LOAD KERNEL MODULES
# ------------------------------------------------------------------------------
- name: Install required baseline packages
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
      - lsb-release
      - uidmap
      - jq
      - apt-transport-https
    state: present
    update_cache: true

- name: Load mandatory kernel modules
  ansible.builtin.command:
    cmd: modprobe {{ item }}
  loop:
    - overlay
    - br_netfilter
  changed_when: false
  failed_when: false

- name: Persist mandatory kernel modules in /etc/modules-load.d/
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s-modules.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"

- name: Try to load shiftfs module (optional for Sysbox)
  ansible.builtin.command:
    cmd: modprobe shiftfs
  register: common_shiftfs_modprobe
  changed_when: false
  failed_when: false
  when: common_enable_shiftfs | default(true) | bool

- name: Check shiftfs module status
  ansible.builtin.shell:
    cmd: set -o pipefail && lsmod | grep '^shiftfs' || true
    executable: /bin/bash
  register: common_shiftfs_check
  changed_when: false
  when: common_enable_shiftfs | default(true) | bool

- name: Persist shiftfs module if available
  ansible.builtin.copy:
    dest: /etc/modules-load.d/shiftfs.conf
    content: "shiftfs\n"
    mode: "0644"
  when:
    - common_enable_shiftfs | default(true) | bool
    - common_shiftfs_check.stdout is defined
    - common_shiftfs_check.stdout != ""

- name: Configure sysctl for Kubernetes and User Namespaces (Sysbox prerequisite)
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-k8s-sysbox.conf
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
      kernel.unprivileged_userns_clone = 1
      kernel.apparmor_restrict_unprivileged_userns = 0
      net.ipv4.ping_group_range = 0 2147483647
      # [TẠI SAO CẦN THÊM CỜ NÀY?]: Sysbox chạy unprivileged userns. Nếu không set 0 ở cấp độ Host, 
      # Container sẽ kế thừa giá trị mặc định (1024) của Kernel, dẫn đến lỗi "Permission denied" 
      # khi sshd (chạy dưới quyền root ảo) cố gắng bind vào port 22 bên trong container.
      net.ipv4.ip_unprivileged_port_start = 0
    mode: "0644"

- name: Apply sysctl configuration immediately
  ansible.builtin.command:
    cmd: sysctl --system
  changed_when: false
  failed_when: false

# ------------------------------------------------------------------------------
# 5. CÀI ĐẶT LXCFS ĐỂ GIẢ LẬP TÀI NGUYÊN BÊN TRONG CONTAINER
# Lý do: Mặc dù Sysbox có tích hợp sysbox-fs nhưng đôi khi trên K3s/Containerd, 
# nó không nhận diện được cgroup của Pod để giả lập /proc/meminfo. LXCFS là bắt buộc 
# để lệnh "free -h" hiển thị đúng RAM của Pod (1GB) thay vì RAM host (15GB).
# ------------------------------------------------------------------------------
- name: Install LXCFS for container resource virtual display
  ansible.builtin.apt:
    name: lxcfs
    state: present
  when: common_enable_lxcfs | default(true) | bool

- name: Enable and start LXCFS service
  ansible.builtin.systemd:
    name: lxcfs
    enabled: true
    state: started
  when:
    - common_enable_lxcfs | default(true) | bool
    - ansible_virtualization_type | default('') != "docker"
  failed_when: false

# ------------------------------------------------------------------------------
# 6. [LOẠI BỎ] THIẾT LẬP CẤU HÌNH USER-NAMESPACES CHO K3S
# Lý do: Tính năng UserNamespacesSupport của K8s (hostUsers: false) xung đột trực tiếp 
# với cơ chế User Namespace do Sysbox tự quản lý nội bộ. Kích hoạt cờ này sẽ khiến Kubelet 
# tự động can thiệp vào sysctl (như ip_unprivileged_port_start), gây lỗi Permission Denied.
