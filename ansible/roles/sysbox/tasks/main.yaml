---
# ==============================================================================
# ROLE SYSBOX: TRIỂN KHAI ĐỘNG CƠ CONTAINER-IN-CONTAINER VÀ RUNTIMECLASS (K3S / KUBEADM)
# ==============================================================================
- name: Wait for all cluster nodes (Master & Workers) to register as Ready in K8s
  ansible.builtin.command:
    cmd: "{{ sysbox_kubectl }} wait --for=condition=Ready node --all --timeout=300s"
  changed_when: false
  retries: 3
  delay: 10
  register: sysbox_wait_nodes
  until: sysbox_wait_nodes.rc == 0

- name: Label ALL cluster nodes for Sysbox automated installation
  ansible.builtin.command:
    cmd: "{{ sysbox_kubectl }} label nodes --all sysbox-install=yes --overwrite"
  changed_when: false

- name: Apply Sysbox DaemonSet installer manifest
  ansible.builtin.command:
    cmd: "{{ sysbox_kubectl }} apply -f {{ sysbox_manifest_url }}"
  changed_when: true

- name: Wait for Sysbox installer pods to converge in kube-system namespace
  ansible.builtin.shell:
    cmd: "set -o pipefail && {{ sysbox_kubectl }} get pods -n kube-system | grep -i sysbox"
    executable: /bin/bash
  register: sysbox_pods
  retries: 30
  delay: 10
  until: sysbox_pods.rc == 0
  changed_when: false

- name: Wait for sysbox-runc binary to be materialized across systems
  ansible.builtin.wait_for:
    path: /usr/bin/sysbox-runc
    state: present
    timeout: 600
  when: ansible_virtualization_type | default('') != "docker"

- name: Ensure Sysbox daemon systemd services are active and enabled
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - sysbox
    - sysbox-fs
    - sysbox-mgr
  when: ansible_virtualization_type | default('') != "docker"
  failed_when: false

- name: Create Sysbox RuntimeClass resource definition
  ansible.builtin.copy:
    dest: /tmp/sysbox-runtimeclass.yaml
    content: |
      apiVersion: node.k8s.io/v1
      kind: RuntimeClass
      metadata:
        name: sysbox-runc
      handler: sysbox-runc
    mode: "0644"

- name: Apply Sysbox RuntimeClass into Kubernetes cluster
  ansible.builtin.command:
    cmd: "{{ sysbox_kubectl }} apply -f /tmp/sysbox-runtimeclass.yaml"
  changed_when: true

- name: Verify Traefik Ingress Controller availability (K3s specific)
  ansible.builtin.command:
    cmd: >-
      {{ sysbox_kubectl }} wait --namespace kube-system
      --for=condition=ready pod
      --selector=app.kubernetes.io/name=traefik
      --timeout=180s
  register: sysbox_traefik_ready
  retries: 5
  delay: 10
  until: sysbox_traefik_ready.rc == 0
  changed_when: false
  when: kubernetes_distro | default('k3s') == 'k3s'

- name: Display cluster readiness status and RuntimeClass
  ansible.builtin.shell:
    cmd: "{{ sysbox_kubectl }} get nodes -o wide && {{ sysbox_kubectl }} get runtimeclass"
    executable: /bin/bash
  register: sysbox_cluster_summary
  changed_when: false

- name: Print finalized Master/Worker cluster summary
  ansible.builtin.debug:
    var: sysbox_cluster_summary.stdout_lines
