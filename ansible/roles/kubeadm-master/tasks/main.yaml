---
# ==============================================================================
# ROLE KUBEADM-MASTER: KHỞI TẠO CONTROL PLANE VÀ TRIỂN KHAI CALICO CNI
# ==============================================================================
- name: Check if Kubernetes control-plane is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_master_conf_stat

- name: Render kubeadm init configuration file
  ansible.builtin.copy:
    dest: "{{ kubeadm_config_path }}"
    content: |
      apiVersion: kubeadm.k8s.io/v1beta4
      kind: InitConfiguration
      nodeRegistration:
        criSocket: unix:///run/containerd/containerd.sock
      ---
      apiVersion: kubeadm.k8s.io/v1beta4
      kind: ClusterConfiguration
      kubernetesVersion: {{ kubeadm_k8s_version | default('v1.35.0') }}
      networking:
        podSubnet: {{ kubeadm_pod_subnet | default('192.168.0.0/16') }}
      ---
      apiVersion: kubelet.config.k8s.io/v1beta1
      kind: KubeletConfiguration
      cgroupDriver: systemd
    mode: "0644"
  when: not kubeadm_master_conf_stat.stat.exists

- name: Initialize Kubernetes cluster using kubeadm
  ansible.builtin.command:
    cmd: "kubeadm init --config {{ kubeadm_config_path }}"
  when: not kubeadm_master_conf_stat.stat.exists
  changed_when: true

- name: Create .kube directory for root user
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    mode: "0755"

- name: Copy admin.conf to root user kubeconfig
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: true
    mode: "0600"

- name: Lấy thông tin user thật sự đang chạy lệnh (tránh bị đè bởi sudo)
  ansible.builtin.set_fact:
    real_user: "{{ lookup('env', 'USER') }}"
    real_home: "{{ lookup('env', 'HOME') }}"
  become: false

- name: Create .kube directory for real user
  ansible.builtin.file:
    path: "{{ real_home }}/.kube"
    state: directory
    owner: "{{ real_user }}"
    mode: "0755"
  become: true
  when: real_user != 'root'

- name: Copy admin.conf to real user kubeconfig
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "{{ real_home }}/.kube/config"
    remote_src: true
    owner: "{{ real_user }}"
    mode: "0600"
  become: true
  when: real_user != 'root'

- name: Deploy Calico CNI networking plugin
  ansible.builtin.command:
    cmd: "kubectl apply -f {{ kubeadm_calico_url }}"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: true

- name: Taint master node with PreferNoSchedule to allow scheduling if needed
  ansible.builtin.command:
    cmd: "kubectl taint nodes --all node-role.kubernetes.io/control-plane:PreferNoSchedule --overwrite"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  changed_when: false
  failed_when: false

- name: Generate worker node join command
  ansible.builtin.command:
    cmd: kubeadm token create --print-join-command
  register: kubeadm_master_join_cmd_raw
  changed_when: false

- name: Share worker join command across Ansible hosts
  ansible.builtin.set_fact:
    kubeadm_join_cmd: "{{ kubeadm_master_join_cmd_raw.stdout }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['k8s_workers'] | default([]) }}"
