---
# ==============================================================================
# ROLE K3S-MASTER: KHỞI TẠO MÁY CHỦ CONTROL PLANE VÀ TOKEN
# ==============================================================================
- name: Install K3s Control Plane (Server)
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: "0755"

- name: Run K3s installer script
  ansible.builtin.command:
    cmd: /tmp/k3s-install.sh server
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"

- name: Ensure K3s server service is enabled and active
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started

- name: Wait for kubeconfig to be generated on Master node
  ansible.builtin.wait_for:
    path: "{{ kubeconfig_remote }}"
    state: present
    timeout: 120

- name: Wait for Master node to register in Ready condition
  ansible.builtin.command:
    cmd: k3s kubectl wait --for=condition=Ready node --all --timeout=180s
  changed_when: false

- name: Extract K3s Node Token for Worker nodes cluster joining
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: k3s_master_token_b64

- name: Set K3s Node Token and Master IP facts into Ansible Engine RAM
  ansible.builtin.set_fact:
    k3s_node_token: "{{ k3s_master_token_b64['content'] | b64decode | trim }}"
    k3s_master_ip: "{{ k3s_api_host }}"

- name: Create .kube directory in admin home folder
  ansible.builtin.file:
    path: "~/.kube"
    state: directory
    mode: "0755"
  become: false

- name: Copy kubeconfig to admin home folder on Master node
  ansible.builtin.copy:
    src: "{{ kubeconfig_remote }}"
    dest: "~/.kube/config"
    remote_src: true
    owner: "{{ ansible_user | default(ansible_env.USER) }}"
    mode: "0600"
  become: true

- name: Fetch kubeconfig from Master to control station (./k3s.yaml)
  ansible.builtin.fetch:
    src: "{{ kubeconfig_remote }}"
    dest: ./k3s.yaml
    flat: true

- name: Replace 127.0.0.1 with Master external IP in local kubeconfig
  delegate_to: localhost
  become: false
  ansible.builtin.replace:
    path: ./k3s.yaml
    regexp: 'https://(127\.0\.0\.1|localhost):6443'
    replace: 'https://{{ k3s_master_ip }}:6443'
