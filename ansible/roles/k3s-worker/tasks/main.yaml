---
# ==============================================================================
# ROLE K3S-WORKER: CÀI ĐẶT AGENT VÀ GIA NHẬP VÀO MASTER
# ==============================================================================
# Chốt chặn an toàn: Điều kiện "when: 'k8s_master' not in group_names" đảm bảo
# nếu bạn lỡ tay điền nhầm IP Master xuống cả mục [k8s_workers], Ansible sẽ tự
# động block không cho phép cài đè dịch vụ Worker Agent lên Control Plane.
# ==============================================================================

- name: Download K3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: "0755"
  when: "'k8s_master' not in group_names"

- name: Install K3s Agent (Worker) pointing to Control Plane node
  ansible.builtin.command:
    cmd: /tmp/k3s-install.sh agent
    creates: /usr/local/bin/k3s-agent
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    K3S_URL: >-
      https://{{ hostvars[groups['k8s_master'][0]]['master_ip']
      | default(hostvars[groups['k8s_master'][0]]['ansible_host'])
      | default(groups['k8s_master'][0]) }}:6443
    K3S_TOKEN: "{{ hostvars[groups['k8s_master'][0]]['k3s_node_token'] }}"
  when: "'k8s_master' not in group_names"

- name: Ensure K3s agent service is enabled and started on Worker nodes
  ansible.builtin.systemd:
    name: k3s-agent
    enabled: true
    state: started
  when: "'k8s_master' not in group_names"
