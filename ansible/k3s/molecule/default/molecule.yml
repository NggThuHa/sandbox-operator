---
# molecule/default/molecule.yml
driver:
  name: docker

platforms:
  - name: k3s-node-test
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    command: /lib/systemd/systemd
    privileged: true
    pre_build_image: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    tmpfs:
      - /run
      - /tmp

provisioner:
  name: ansible
  playbooks:
    converge: converge.yml
    verify: verify.yml
  config_options:
    defaults:
      # Trỏ đúng thư mục roles tương đối từ molecule scenario directory
      roles_path: ../../roles
  inventory:
    group_vars:
      all:
        common_enable_shiftfs: false
        common_enable_lxcfs: false

# Bỏ qua dependency và cleanup vì không có requirements.yml hay cleanup.yml
scenario:
  test_sequence:
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy

verifier:
  name: ansible
