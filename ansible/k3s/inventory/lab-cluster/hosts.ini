# ==============================================================================
# DANH SÁCH MÁY CHỦ CỦA CỤM K3S LAB (KUBESPRAY STYLE INVENTORY)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. NHÓM CONTROL PLANE (Kube-apiserver):
# ------------------------------------------------------------------------------
[k3s_master]
<MASTER_IP> ansible_user=<USER>


# ------------------------------------------------------------------------------
# 2. NHÓM WORKER NODES (Nhà xưởng chạy máy ảo Lab cho sinh viên):
# ------------------------------------------------------------------------------
[k3s_workers]
# Liệt kê từng IP:
# 192.168.1.101
# 192.168.1.102
# 192.168.1.103

# Hoặc dùng cú pháp DẢI IP / TÊN MIỀN HÀNG LOẠT (Range syntax):
# node-worker-[01:05].lab.toiyeuptit.com
# 192.168.10.[50:60]

[k3s_workers:vars]
ansible_user=<USER>
# ansible_ssh_private_key_file=~/.ssh/id_rsa
# # ansible_become_pass="your_sudo_password"


# ==============================================================================
# 3. NHÓM TỔNG HỢP TOÀN CỤM K3S CLUSTER:
# (Tương tự k8s_cluster:children trong Kubespray)
# ==============================================================================
[k3s_cluster:children]
k3s_master
k3s_workers
