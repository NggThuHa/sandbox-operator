---
# molecule/default/verify.yml
# Xác minh kết quả sau khi converge chạy xong
- name: Verify
  hosts: all
  become: true

  tasks:
    - name: Verify required packages are installed
      ansible.builtin.package:
        name:
          - curl
          - ca-certificates
          - jq
        state: present

    - name: Verify K3s config directory exists
      ansible.builtin.stat:
        path: /etc/rancher/k3s
      register: k3s_dir

    - name: Assert K3s directory exists
      ansible.builtin.assert:
        that:
          - k3s_dir.stat.exists

    - name: Verify K3s config file is written
      ansible.builtin.stat:
        path: /etc/rancher/k3s/config.yaml
      register: k3s_config

    - name: Assert K3s config file exists
      ansible.builtin.assert:
        that:
          - k3s_config.stat.exists

    - name: Verify sysctl config file is written (99-k8s-sysbox.conf)
      ansible.builtin.stat:
        path: /etc/sysctl.d/99-k8s-sysbox.conf
      register: sysctl_config

    - name: Assert sysctl config exists
      ansible.builtin.assert:
        that:
          - sysctl_config.stat.exists

    - name: Slurp K3s config content for validation
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/config.yaml
      register: k3s_config_content

    - name: Assert K3s config has UserNamespacesSupport flag
      ansible.builtin.assert:
        that:
          - "'UserNamespacesSupport' in (k3s_config_content['content'] | b64decode)"
        fail_msg: "K3s config is missing UserNamespacesSupport feature gate"
