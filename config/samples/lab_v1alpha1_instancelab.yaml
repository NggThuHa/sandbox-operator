apiVersion: lab.devops.toiyeuptit.com/v1alpha1
kind: InstanceLab
metadata:
  labels:
    app.kubernetes.io/name: typ-operator
    app.kubernetes.io/managed-by: kustomize
  name: instancelab-sample
spec:
  clusterLabRef: clusterlab-sample
  image: ubuntu:24.04
  # imagePullSecrets:
  #   - name: my-private-registry-secret
  hostname: ubuntu-vm
  resources:
    cpu:
      request: "500m"
      limit: "1"
    memory:
      request: "512Mi"
      limit: "1Gi"
    storage:
      limit: "20Gi"
  ports:
    - name: terminal
      port: 8080
      targetPort: 7681
      expose: true
