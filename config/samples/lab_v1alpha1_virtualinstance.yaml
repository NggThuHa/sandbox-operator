apiVersion: lab.devops.toiyeuptit.com/v1alpha1
kind: VirtualInstance
metadata:
  labels:
    app.kubernetes.io/name: typ-operator
    app.kubernetes.io/managed-by: kustomize
  name: virtualinstance-sample
spec:
  virtualClusterRef: virtualcluster-sample
  image: ubuntu:24.04
  # imagePullSecrets:
  #   - name: my-private-registry-secret
  hostname: ubuntu-vm
  resources:
    cpu:
      request: "500m"
      limit: "1"
    memory:
      request: "512Mi"
      limit: "1Gi"
  storage:
    root:
      size: "10Gi"
      type: local
    dataVolumes:
      - name: docker-data
        mountPath: /var/lib/docker
        size: "20Gi"
        type: network
  ports:
    - name: terminal
      port: 8080
      targetPort: 7681
      expose: true
