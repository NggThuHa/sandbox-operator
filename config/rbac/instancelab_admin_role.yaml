# This rule is not used by the project kubebuilder itself.
# It is provided to allow the cluster admin to help manage permissions for users.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubebuilder
    app.kubernetes.io/managed-by: kustomize
  name: instancelab-admin-role
rules:
- apiGroups:
  - lab.devops.toiyeuptit.com
  resources:
  - instancelabs
  verbs:
  - '*'
- apiGroups:
  - lab.devops.toiyeuptit.com
  resources:
  - instancelabs/status
  verbs:
  - get
